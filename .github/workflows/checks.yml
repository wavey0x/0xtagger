name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A book's URL belongs on the machine that reads it, never in the checkout.
      - name: No personal tailnet hostname is tracked
        run: |
          if git grep -nIE 'tail[0-9a-f]{4,}\.ts\.net' -- .; then
            echo 'Configure the book in ~/.config/0xtagger/config.json instead.' >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.13'
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: uv sync --locked
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: uv run pytest -q
      - run: npm test
      - run: npm run test:browser
