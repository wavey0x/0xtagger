<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>0xtagger</title><link rel="stylesheet" href="colors.css"><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="popup.css"></head>
<body>
  <main>
    <section id="home" class="panel">
      <header class="view-heading"><h1 class="brand" aria-label="0xtagger"><img class="brand-mark" src="icons/mark.svg" alt="0x">tagger</h1></header>
      <span class="eyebrow">Address book</span>
      <div class="connection-line">
        <button id="location" aria-label="Where your book is kept" aria-haspopup="menu" aria-expanded="false" popovertarget="location-menu"><span>On this device</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button>
        <div id="location-menu" popover role="menu" aria-label="Where to keep your book"></div>
      </div>
      <p id="sync" class="muted" role="status"></p>
      <section class="site">
        <strong id="site-name"></strong>
        <button id="site-toggle" class="switch" role="switch" aria-checked="false" aria-label="Show my tags on this website" aria-describedby="site-name"><span></span></button>
      </section>
      <button id="import-site" class="quiet import-site" hidden></button>
      <div id="adapter-warning" hidden><p></p><button id="retry" class="quiet">Retry</button><button id="disable" class="quiet">Turn off</button></div>
      <section class="finder" aria-label="Find or add an address">
        <label for="lookup">Find or add</label>
        <div class="lookup-field"><input id="lookup" type="search" placeholder="Search tags or paste 0x address" autocomplete="off" spellcheck="false" data-bwignore="true"><button id="lookup-clear" type="button" class="quiet" aria-label="Clear search" hidden>×</button></div>
        <p id="lookup-status" class="sr-only" role="status"></p>
        <div id="lookup-result"></div>
      </section>
      <button id="open-book" class="open-book quiet"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.3 2.7h5.9a1.5 1.5 0 0 1 1.5 1.5v7.6a1.5 1.5 0 0 1-1.5 1.5H6.3Z"/><path d="M3.4 5.3h2.9M3.4 8h2.9M3.4 10.7h2.9"/></svg><span>Open address book</span><svg class="go" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12 8-8M4 4h8v8"/></svg></button>
    </section>
    <section id="server" class="panel" hidden></section>
    <div id="editor-host" hidden></div>
    <p id="message" class="message" role="status"></p>
  </main>
  <script type="module" src="popup.js"></script>
</body></html>
