<!doctype html><html lang="en"><meta charset="utf-8"><title>0xtagger extension fixture</title>
<style>body{font:14px system-ui;margin:30px;background:white;color:#172033}a{color:#384967}button{margin-left:12px}</style>
<main><h1>Wallets</h1><a id="wallet" href="#wallet">0xabababababababababababababababababababab</a><button id="copy">Copy address</button></main>
<script>
const copy = document.querySelector('#copy');
copy.onclick = async () => {
  const address = document.querySelector('#wallet').textContent;
  await navigator.clipboard.writeText(address);
  copy.dataset.copied = address;
};
for(let i=1;i<500;i++){const p=document.createElement('p');const a=document.createElement('a');a.href='#wallet-'+i;a.textContent='0x'+i.toString(16).padStart(40,'0');p.append(a);document.querySelector('main').append(p);}
</script></html>
